services:
  postgres:
    image: postgres:16.15-bookworm
    container_name: miow-postgres
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 100
    environment:
      POSTGRES_USER: miow_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in .env}
      POSTGRES_DB: miow
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=1024MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miow_bootstrap -d miow"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
    image: ${APP_IMAGE:-miow-lms:local}
    container_name: miow-migrate
    restart: "no"
    init: true
    user: bun
    command: ["bun", "run", "db:migrate"]
    environment:
      MIGRATOR_DATABASE_URL: postgres://miow_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}@postgres:5432/miow
      APP_DATABASE_ROLE: miow_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
    image: ${APP_IMAGE:-miow-lms:local}
    container_name: miow-app
    restart: unless-stopped
    init: true
    user: bun
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://miow_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/miow
      PG_POOL_MAX: "5"
      STORAGE_PATH: /app/storage
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      HARDWARE_API_KEY: ${HARDWARE_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      SITE_URL: ${SITE_URL:-https://akios.site}
      DEBUG_LOGS: "false"
      VITE_DEBUG_LOGS: "false"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      proxy:
        aliases:
          - miow-lms-app
      database: {}
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    name: miow-proxy
    external: true
  database:
    name: miow-database
    internal: true

volumes:
  pgdata:
    name: miow-pgdata
  uploads:
    name: miow-uploads
