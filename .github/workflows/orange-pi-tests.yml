name: Orange Pi branch tests

on:
  push:
    branches:
      - codex/orange-pi-local-postgres
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "db/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".npmrc"
      - "bunfig.toml"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.pgtest.yml"
      - ".prettierrc"
      - "eslint.config.js"
      - ".github/workflows/orange-pi-tests.yml"

permissions:
  contents: read

concurrency:
  group: orange-pi-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/codex/orange-pi-local-postgres'
    runs-on: [self-hosted, linux, ARM64, orange-pi-tests]
    timeout-minutes: 90
    steps:
      - name: Check out this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require idle Pi memory headroom
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
          if (( available_kib < 3145728 )); then
            printf 'Refusing resource-heavy tests: MemAvailable=%s KiB; at least 3 GiB is required.\n' "$available_kib" >&2
            exit 1
          fi
          printf 'MemAvailable=%s KiB; minimum 3 GiB passed.\n' "$available_kib"

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Verify isolated ARM64 test runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          docker compose version >/dev/null
          bun --version

      - name: Validate Compose files without production credentials
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_BOOTSTRAP_PASSWORD="$(openssl rand -hex 32)"
          export POSTGRES_MIGRATOR_PASSWORD="$(openssl rand -hex 32)"
          export POSTGRES_APP_PASSWORD="$(openssl rand -hex 32)"
          export SESSION_SECRET="$(openssl rand -hex 32)"
          export HARDWARE_API_KEY="$(openssl rand -hex 32)"
          export OPENCODE_API_KEY="$(openssl rand -hex 32)"
          export AI_GATEWAY_KEY="$(openssl rand -hex 32)"
          export MIOW_PGTEST_BOOTSTRAP_PASSWORD="$(openssl rand -hex 32)"
          export MIOW_PGTEST_MIGRATOR_PASSWORD="$(openssl rand -hex 32)"
          export MIOW_PGTEST_APP_PASSWORD="$(openssl rand -hex 32)"
          export VITE_GOOGLE_CLIENT_ID=ci-placeholder
          export VITE_GOOGLE_API_KEY=ci-placeholder
          export APP_IMAGE=miow-lms:ci
          export AI_BASE_URL=https://example.invalid
          export SITE_URL=https://example.invalid
          export APP_BIND_ADDRESS=0.0.0.0
          docker compose --project-name miow-compose-validation --file docker-compose.yml config --quiet
          docker compose --project-name miow-pgtest-validation --file docker-compose.pgtest.yml config --quiet

      - name: Remove leftovers from interrupted PostgreSQL tests
        run: sh scripts/cleanup-postgres-test.sh

      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

      - name: Run migration tests
        run: bun run test:migrations

      - name: Run isolated PostgreSQL 16 integration tests
        run: bun run test:integration

      - name: Build production bundle
        run: bun run build

      - name: Clean disposable PostgreSQL resources
        if: always()
        run: sh scripts/cleanup-postgres-test.sh
