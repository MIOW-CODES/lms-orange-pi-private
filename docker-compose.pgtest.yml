services:
  postgres:
    image: postgres:16.15-bookworm
    shm_size: 128mb
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 100
    environment:
      POSTGRES_USER: miow_bootstrap
      POSTGRES_PASSWORD: ${MIOW_PGTEST_BOOTSTRAP_PASSWORD:?Generated by bun run test:integration}
      POSTGRES_DB: miow
      POSTGRES_MIGRATOR_PASSWORD: ${MIOW_PGTEST_MIGRATOR_PASSWORD:?Generated by bun run test:integration}
      POSTGRES_APP_PASSWORD: ${MIOW_PGTEST_APP_PASSWORD:?Generated by bun run test:integration}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miow_bootstrap -d miow"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
